
name: Security Scans

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep==1.187.0

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/csharp \
            --sarif \
            --output semgrep.sarif \
            --metrics=off \
            .

      - name: Check High/Critical and SQL Injection findings
        run: |
          python - <<'PY'
          import json
          import sys

          with open("semgrep.sarif", encoding="utf-8") as file:
              sarif = json.load(file)

          blocking = []

          for run in sarif.get("runs", []):
              rules = {
                  rule.get("id"): rule
                  for rule in run.get("tool", {}).get("driver", {}).get("rules", [])
              }

              for result in run.get("results", []):
                  rule_id = result.get("ruleId", "Unknown rule")
                  rule = rules.get(rule_id, {})

                  result_properties = result.get("properties", {})
                  rule_properties = rule.get("properties", {})

                  severity_score = (
                      result_properties.get("security-severity")
                      or rule_properties.get("security-severity")
                      or "0"
                  )

                  try:
                      score = float(severity_score)
                  except (TypeError, ValueError):
                      score = 0

                  tags = rule_properties.get("tags", [])

                  is_high_critical = (
                      result.get("level") == "error"
                      or score >= 7
                  )

                  is_sql_injection = (
                      any(
                          isinstance(tag, str) and tag.startswith("CWE-89:")
                          for tag in tags
                      )
                      or "sqli" in rule_id.lower()
                  )

                  if is_high_critical or is_sql_injection:
                      blocking.append(rule_id)

          if blocking:
              print("Blocking Semgrep bulguları bulundu:")
              for finding in blocking:
                  print(f"- {finding}")
              sys.exit(1)

          print("Blocking Semgrep bulgusu bulunmadı.")
          PY

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  trivy:
    name: Trivy SCA
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy and generate SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Fail on High/Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          ignore-unfixed: false
          exit-code: "1"
          skip-setup-trivy: true
